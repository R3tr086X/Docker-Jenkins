version: "3.8"

services:

  db:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD}
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build: .
    ports:
      - "8018:80"
    environment:
      ROOT_PASSWORD: ${ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
